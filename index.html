<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            margin-top: 20px;
        }

        .image-container {
            position: relative;
            display: inline-block;
            margin: 20px;
        }

        .image-container img {
            width: 400px;
            border-radius: 10px;
            user-select: none;
            pointer-events: none;
        }

        .watermark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 5px;
        }

        body {
            user-select: none;
        }

        .download-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body oncontextmenu="return false;">

    <h1>Welcome to My First Page</h1>

    <!-- Image 1 -->
    <div class="image-container">
        <img src="Stars_1.jpg" alt="Image 1">
        <div class="watermark">© JCCT</div>
        <br>
        <a href="Stars_1.jpg" download>
            <button class="download-btn">Download Image 1</button>
        </a>
    </div>

    <!-- Image 2 -->
    <div class="image-container">
        <img src="Stars_2.jpg" alt="Image 2">
        <div class="watermark">© JCCT</div>
        <br>
        <a href="Stars_2.jpg" download>
            <button class="download-btn">Download Image 2</button>
        </a>
    </div>

</body>
</html>
