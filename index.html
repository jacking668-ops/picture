<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        canvas {
            margin: 20px;
            border-radius: 10px;
        }

        .download-btn {
            margin: 10px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<h1>Welcome to JCCT Art Pictures Page</h1>

<!-- Canvas for images -->
<canvas id="canvas1" width="400"></canvas><br>
<button class="download-btn" onclick="downloadImage('canvas1')">Download Image 1</button>

<br>

<canvas id="canvas2" width="400"></canvas><br>
<button class="download-btn" onclick="downloadImage('canvas2')">Download Image 2</button>

<script>
function addWatermark(canvasId, imageSrc, text) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    const img = new Image();

    img.src = imageSrc;
    img.onload = function () {
        canvas.height = img.height * (400 / img.width);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Watermark text inside image
        ctx.font = "20px Arial";
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fillRect(canvas.width - 130, canvas.height - 40, 120, 30);

        ctx.fillStyle = "black";
        ctx.fillText(text, canvas.width - 120, canvas.height - 18);
    };
}

// Apply watermark to both images
addWatermark("canvas1", "Stars_1.jpg", "© JCCT");
addWatermark("canvas2", "Stars_2.jpg", "© JCCT");

// Download function
function downloadImage(canvasId) {
    const canvas = document.getElementById(canvasId);
    const link = document.createElement("a");
    link.download = canvasId + ".png";
    link.href = canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
